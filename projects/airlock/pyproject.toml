[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock"
version = "0.1.0"
description = "Local AI Airlock for safe cloud-model requests"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=2.2,<3",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
airlock = "airlock.cli:app"

[tool.setuptools.packages.find]
include = ["airlock*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
